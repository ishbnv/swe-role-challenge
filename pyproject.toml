[project]
name = "plugin-runtime"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = ["sqlalchemy>=2.0.52,<2.1", "psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.0",
    "pytest>=8",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["postgres: requires the disposable Docker interview PostgreSQL"]

[tool.basedpyright]
include = ["."]
strict = ["core", "adapters", "apps", "plugins", "main.py"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
